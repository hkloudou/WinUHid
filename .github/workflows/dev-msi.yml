name: Dev build (test-signed, not for distribution)

# build         compiles the driver and libraries, signs the driver package with a throwaway
#               certificate created inside the run, and packages the MSI plus tester scripts.
# install-test  takes that package to clean machines and runs install -> self test -> uninstall.
#               Server 2022 exercises the INF's Windows 10 rules, Server 2025 the Windows 11 rules.
# report        writes the reports and log tails of all jobs to the `ci-results` branch.
# release       when everything passed, refreshes the `dev-test` pre-release with the package.
#
# The package produced here is for test machines only.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONFIGURATION: Release
  PLATFORM: x64

jobs:
  build:
    name: Build and sign
    runs-on: windows-2022     # ships Visual Studio 2022 with the WDK; newer images do not
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Toolchain report
      shell: pwsh
      run: ./ci/toolchain-report.ps1

    - name: Ensure WDK
      shell: pwsh
      run: ./ci/ensure-wdk.ps1

    - name: Create throwaway test certificate
      shell: pwsh
      run: ./ci/new-test-cert.ps1

    - name: Restore NuGet packages
      run: msbuild WinUHid.sln -t:restore -p:RestorePackagesConfig=true -v:minimal

    - name: Build driver
      shell: pwsh
      run: ./ci/msbuild-project.ps1 -Project 'WinUHid Driver\WinUHid Driver.vcxproj' -LogName '01-driver' -Extra '/p:SignMode=Off'

    - name: Sign driver package
      shell: pwsh
      run: ./ci/sign-package.ps1

    - name: Build libraries
      shell: pwsh
      run: ./ci/msbuild-project.ps1 -Project 'WinUHidDevs\WinUHidDevs.vcxproj' -LogName '02-libraries'

    - name: Build installer helper
      shell: pwsh
      run: ./ci/msbuild-project.ps1 -Project 'Installer\RootDevCA\RootDevCA.vcxproj' -LogName '03-rootdevca'

    - name: Build and check MSI
      shell: pwsh
      run: ./ci/build-msi.ps1

    - name: Assemble tester kit
      shell: pwsh
      run: ./ci/assemble-kit.ps1

    - name: Job summary
      if: always()
      shell: pwsh
      run: if (Test-Path out/report.md) { Get-Content out/report.md | Add-Content $env:GITHUB_STEP_SUMMARY }

    - name: Upload tester kit
      uses: actions/upload-artifact@v4
      with:
        name: WinUHid-dev-test
        path: out/kit/
        if-no-files-found: error

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-build
        path: |
          out/report.md
          out/logs/
        if-no-files-found: warn

  install-test:
    name: Install test on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download tester kit
      uses: actions/download-artifact@v4
      with:
        name: WinUHid-dev-test
        path: out/kit

    - name: Install, self test, uninstall
      shell: pwsh
      run: ./ci/install-test.ps1

    - name: Job summary
      if: always()
      shell: pwsh
      run: if (Test-Path out/report.md) { Get-Content out/report.md | Add-Content $env:GITHUB_STEP_SUMMARY }

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-install-${{ matrix.os }}
        path: |
          out/report.md
          out/logs/
        if-no-files-found: warn

  report:
    name: Publish results branch
    needs: [build, install-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download logs of all jobs
      uses: actions/download-artifact@v4
      with:
        pattern: logs-*
        path: results

    - name: Publish to the ci-results branch
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RESULT_BUILD: ${{ needs.build.result }}
        RESULT_INSTALL: ${{ needs.install-test.result }}
      run: ./ci/publish-results.sh

    # Temporary: removes the runs left over from setting this pipeline up.
    - name: One-off cleanup
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh run list --repo "$GITHUB_REPOSITORY" --limit 100 --json databaseId,status \
          --jq '.[] | select(.status == "completed") | .databaseId' | while read -r id; do
          if [ "$id" != "$GITHUB_RUN_ID" ]; then
            gh run delete "$id" --repo "$GITHUB_REPOSITORY" && echo "deleted run $id" || true
          fi
        done

  release:
    name: Refresh the dev-test pre-release
    needs: [build, install-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download tester kit
      uses: actions/download-artifact@v4
      with:
        name: WinUHid-dev-test
        path: WinUHid-dev-test-kit

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        (cd WinUHid-dev-test-kit && zip -q -r ../WinUHid-dev-test-kit.zip .)
        {
          cat ci/release-notes.md
          echo
          echo "- 提交：$GITHUB_SHA"
          echo "- 构建记录：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "- 测试证书指纹：$(tr -d '\r\n' < WinUHid-dev-test-kit/cert-thumbprint.txt)"
          echo "- 已通过安装测试的系统：Windows Server 2022（Win10 规则）、Windows Server 2025（Win11 规则）"
        } > notes.md
        gh release delete dev-test --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
        sleep 5
        gh release create dev-test WinUHid-dev-test-kit.zip \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "开发测试包（仅限测试机）" \
          --notes-file notes.md
